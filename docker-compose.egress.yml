# LUM-618 — container-network egress containment overlay for untrusted community
# capabilities. Compose this ON TOP of the stack that runs a community capability
# (e.g. the public RC stack) AND activate the profile:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.test.yml:\
#     docker-compose.public-rc-stack.yml:docker-compose.egress.yml \
#   COMPOSE_PROFILES=community-egress docker compose up
#
# What it does:
#   * `community-egress-internal` is `internal: true` — Docker gives it NO route
#     to the internet (IPv4) and `enable_ipv6: false` closes the IPv6 path.
#   * The community capability (the mock) joins ONLY that isolated network, so its
#     ONLY way out is the `egress-proxy` (Squid), which allowlists its declared
#     hosts by SNI (peek+splice, no MITM) / dstdomain. Deny-all default.
#   * The orchestrator is dual-homed (default + isolated) so Core can still
#     dispatch INBOUND to the capability; Core is trusted and keeps its own
#     internet path on `default` — it never forwards for the capability.
#   * `egress-proxy` is the ONLY service bridging internal<->external. The
#     compose-policy Pass C verifies this membership in CI.
#
# Hard enforcement is Docker-Compose-only. Native deployments cannot contain a
# separate container's egress; community capabilities stay refused there.

volumes:
  egress_proxy_logs:

networks:
  # Keep the project default network (internet-capable) for Core + infra.
  default: {}
  # Isolated: no route to the internet. Community capabilities live here only.
  community-egress-internal:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.0.0/24
  # The proxy's only internet-facing leg.
  community-egress-external:
    enable_ipv6: false

services:
  # The dedicated egress proxy — the sole egress path for the isolated network.
  egress-proxy:
    profiles: ["community-egress"]
    # Must be built --with-openssl (ssl_bump / peek / splice). ubuntu/squid:latest
    # as of 2026-07 is NOT — default to an OpenSSL Squid; pin by digest in deploy.
    # Verify: `docker run --rm <img> squid -v | grep -- --with-openssl`.
    image: ${EGRESS_PROXY_IMAGE:-jacobalberty/squid@sha256:559a8dd2178cf9a40b9a526948467448bb627de98cb22edfddf4699b86a9f370}
    # Generate the (never-committed, splice-only) bump cert, start the LUM-758
    # allow-file watcher, then run Squid in the foreground. Extracted to a script
    # so the watcher is readable and unit-testable — and so the three overlays
    # that boot this proxy cannot drift apart.
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      # LUM-758. Consumed here AND by Core's email-providers route: if the watcher
      # is off, Core must tell members a mailbox add still needs an operator. The
      # two must never disagree, or setup goes back to promising a sync that never
      # happens.
      LUMOGIS_EGRESS_ALLOW_WATCH: ${LUMOGIS_EGRESS_ALLOW_WATCH:-1}
      LUMOGIS_EGRESS_ALLOW_POLL_SECONDS: ${LUMOGIS_EGRESS_ALLOW_POLL_SECONDS:-2}
    volumes:
      - ./docker/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/egress-proxy/allow:/etc/squid/allow:ro
      - ./docker/egress-proxy/gen-bump-cert.sh:/usr/local/bin/gen-bump-cert.sh:ro
      - ./docker/egress-proxy/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - egress_proxy_logs:/var/log/squid
    healthcheck:
      # LIVENESS: TCP connect (needs bash — dash has no /dev/tcp) AND, when the
      # watcher is enabled, a fresh heartbeat. Squid stays reachable on 3128 whether
      # or not the watch loop is alive, so a TCP probe alone would report green
      # while a member's mailbox additions silently stopped being applied.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/3128 && { [ "$${LUMOGIS_EGRESS_ALLOW_WATCH:-1}" = "0" ] || find /var/run/lumogis-allow-watch.alive -mmin -1 2>/dev/null | grep -q .; }'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      community-egress-internal:
        ipv4_address: 172.31.0.2
      community-egress-external: {}

  # Core: keep the internet-capable default network AND join the isolated network
  # so it can dispatch inbound to the contained capability. It also sources the
  # containment marker from THIS overlay (see LUMOGIS_CONTAINED_CAPABILITIES_FILE)
  # so "contained" can never be asserted without the wiring that provides it.
  # No depends_on egress-proxy here: the containment guarantee is the isolated
  # network (no route), which holds whether or not the proxy is up, and coupling
  # an un-profiled service to the profiled proxy would break `up` when the
  # community-egress profile is inactive.
  orchestrator:
    networks:
      default: {}
      # Static IP on the isolated network so the Squid `core_egress_src` ACL can
      # scope the LUM-625 email-IMAP CONNECT egress to Core alone (172.31.0.3),
      # keeping contained community capabilities (172.31.0.10+) out of it.
      community-egress-internal:
        ipv4_address: 172.31.0.3
    environment:
      LUMOGIS_CONTAINED_CAPABILITIES_FILE: /etc/lumogis/contained_capabilities.txt
      LUMOGIS_EGRESS_ACCESS_LOG: /var/log/squid/access.log
      LUMOGIS_EGRESS_SRC_MAP: /etc/lumogis/egress_src_map.txt
      LUMOGIS_EGRESS_DENY_DEDUP_SECONDS: "60"
      # LUM-625 Pass 3 (opt-in): to route Core's IMAP(S) egress through the Squid
      # CONNECT proxy, set LUMOGIS_IMAP_EGRESS_PROXY=egress-proxy:3128 (e.g. in
      # your .env). Do this ONLY when the `community-egress` profile is active
      # (so the proxy is running) — otherwise every TLS IMAP connect fails closed
      # because `egress-proxy` won't resolve. Deliberately NOT set unconditionally:
      # this overlay is designed to also run with the profile inactive, where email
      # must keep working under Layer 1. Core is pinned to 172.31.0.3 for the
      # source-scoped Squid ACL. Pair with LUMOGIS_FF_IMAP_EGRESS_GUARD.
      LUMOGIS_IMAP_EGRESS_PROXY: ${LUMOGIS_IMAP_EGRESS_PROXY:-}
      # LUM-673: pin the Layer-2 allow-file dir to the SAME host directory Squid
      # serves (mounted below), so the in-container credential-change regen lands
      # where the proxy reads it. Without this the module writes to a
      # container-local /docker/egress-proxy/allow that nothing mounts.
      LUMOGIS_IMAP_EGRESS_ALLOW_DIR: /etc/lumogis/egress-allow
      # LUM-758: the SAME interpolation source the egress-proxy uses above. Core
      # reads this to decide whether setup must warn that a new mailbox still
      # needs an operator. Declared explicitly here rather than relying on the
      # base compose's `env_file: .env`, because that only agrees when the
      # operator happens to set the variable *in .env* — `LUMOGIS_EGRESS_ALLOW_WATCH=0
      # docker compose up` would reach the proxy and never reach Core, leaving the
      # watcher off while the UI told members no operator was needed.
      LUMOGIS_EGRESS_ALLOW_WATCH: ${LUMOGIS_EGRESS_ALLOW_WATCH:-1}
    volumes:
      - ./docker/egress-proxy/contained_capabilities.rc.txt:/etc/lumogis/contained_capabilities.txt:ro
      - ./docker/egress-proxy/src_capability_map.txt:/etc/lumogis/egress_src_map.txt:ro
      # LUM-673: read-write — the credential-change listener regenerates the allow
      # file here; Squid mounts the SAME host dir read-only at /etc/squid/allow.
      - ./docker/egress-proxy/allow:/etc/lumogis/egress-allow
      - egress_proxy_logs:/var/log/squid:ro

  # The community capability — contained. Isolated network ONLY (no default
  # bridge = no direct internet), static IP for the per-source proxy ACL, and its
  # egress forced through the proxy. (No depends_on egress-proxy: the mock makes
  # no outbound calls at startup, and the no-route isolation is the guarantee —
  # if the proxy is down the mock simply fails closed. Avoids the un-profiled ->
  # profiled dependency that would break `up` without the community-egress profile.)
  lumogis-mock-capability:
    networks:
      community-egress-internal:
        ipv4_address: 172.31.0.10
    # Internal networks drop host port publishing. Clear the public-rc-stack
    # `18080:8080` mapping so the host-bridge below can own that port.
    ports: []
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      # Do NOT list the allowed host here — it must go through the proxy.
      NO_PROXY: localhost,127.0.0.1

  # Host-side RC probe bridge (LUM-618). The mock stays on the isolated network
  # only (Pass C). Published ports on an `internal: true` network are unreachable
  # from the host, which breaks `test_mock_capability_manifest_and_echo` (expects
  # http://127.0.0.1:18080). This dual-homed socat publishes 18080 on the default
  # network and dials INTO the mock — inbound-only; the mock still has no internet.
  mock-capability-host-bridge:
    profiles: ["community-egress"]
    image: alpine/socat:1.8.0.1
    ports:
      - "18080:18080"
    networks:
      default: {}
      # Stay off 172.31.0.2 (proxy), .3 (orchestrator), .10 (mock).
      community-egress-internal:
        ipv4_address: 172.31.0.11
    depends_on:
      lumogis-mock-capability:
        condition: service_healthy
    command:
      - TCP-LISTEN:18080,fork,reuseaddr
      - TCP:172.31.0.10:8080
    restart: unless-stopped
