# LUM-361 — secrets detection for user-authored Lumogis config files
# (pipe.md routines, ~/.lumogis/procedures/*, LUMOGIS_POLICY.md, WAKE.md, …)
# scanned BEFORE the file is loaded into LLM context, so an accidental
# credential never reaches a prompt / audit log / cloud API call.
#
# Schema: patterns[].id, name, regex  (optional: enabled, default true)
# Regex bodies use single-quoted YAML scalars so backslashes pass through to
# Python unchanged; embedded single quotes are YAML-doubled ('' -> ').
# Any single match BLOCKS the file (no severity tiers — a secret is a secret).
# The scanner never logs the raw match; callers show the offending line to the
# user for remediation only.

patterns:
  - id: openai_api_key
    name: OpenAI API key
    regex: 'sk-[a-zA-Z0-9]{48}'

  - id: anthropic_api_key
    name: Anthropic API key
    regex: 'sk-ant-[a-zA-Z0-9-]{80,}'

  - id: slack_bot_token
    name: Slack bot token
    regex: 'xoxb-[0-9]+-[a-zA-Z0-9]+'

  - id: github_pat
    name: GitHub personal access token
    regex: 'ghp_[a-zA-Z0-9]{36}'

  - id: github_s2s_token
    name: GitHub server-to-server token
    regex: 'ghs_[a-zA-Z0-9]{36}'

  - id: google_api_key
    name: Google API key
    regex: 'AIza[0-9A-Za-z_-]{35}'

  # AWS access key id — anchored to the canonical AKIA prefix rather than the
  # naive [A-Z0-9]{20} (which false-positives on any 20-char upper token).
  - id: aws_access_key_id
    name: AWS access key id
    regex: '\bAKIA[0-9A-Z]{16}\b'

  - id: bearer_token
    name: Bearer token
    regex: '(?i)bearer\s+[A-Za-z0-9._-]{20,}'

  - id: hardcoded_password
    name: Hard-coded password assignment
    regex: '(?i)password\s*=\s*["''][^"'']{8,}["'']'

  - id: hardcoded_api_key
    name: Hard-coded api_key assignment
    regex: '(?i)api[_-]?key\s*=\s*["''][^"'']{16,}["'']'

  - id: hardcoded_token
    name: Hard-coded token assignment
    regex: '(?i)token\s*=\s*["''][^"'']{16,}["'']'

  - id: private_key_block
    name: PEM private key block
    regex: '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'

  # Bounded prefix ({0,40}, not unbounded *) to avoid O(n^2) backtracking on a
  # long word-char line, and require a 12+ char value so prose like
  # "API_KEY = <from vault>" (short placeholder) does not block the file.
  - id: env_secret_assignment
    name: Secret-bearing env var assignment
    regex: '(?i)\b[A-Z0-9_]{0,40}(?:API_KEY|SECRET|TOKEN|PASSWORD|ACCESS_KEY)\s*=\s*["'']?[^\s"'']{12,}'

  # UUID-format token. Opt-in (enabled: false) by default: bare UUIDs appear
  # legitimately in config (ids, references) and blocking on them is a common
  # false positive. Operators who use UUID-shaped session tokens can enable it.
  - id: uuid_token
    name: UUID-format token
    regex: '\b[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\b'
    enabled: false
