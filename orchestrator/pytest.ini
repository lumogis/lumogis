[pytest]
asyncio_mode = auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: requires real external services. Applied automatically to everything under orchestrator/tests/integration/ by that directory's conftest (LUM-753) — do not hand-apply it there. Lane discrimination is by PATH, not by this marker: the repo-root tests/integration drives HTTP against a running Core, while orchestrator/tests/integration runs in-process against real backends.
    m1_compat: live FalkorDB compatibility tests (require FALKORDB_URL)
    paperless_live: live paperless-ngx fixture lane (LUM-309). A SELECTOR for `make compose-test-paperless`, never a deselector — `make test` collects these and lets them skip, so they appear in the LUM-718 skip report instead of vanishing (LUM-753).
filterwarnings =
    ignore::DeprecationWarning:apscheduler.*
