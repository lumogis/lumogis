[pytest]
markers =
    integration: requires running Lumogis stack (HTTP against orchestrator / Caddy).
    public_rc: deterministic subset for verify-public-rc (see Makefile).
    slow: slow integration cases (RSS poll windows, graph parity, etc.).
    manual: operator-driven gates skipped by default automation.
    restart_e2e: live-stack test that recreates orchestrator via POST /settings/restart (disruptive; opt-in).
