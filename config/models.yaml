# Lumogis model registry — static default.
# This is the cold-start default. The dashboard (Settings → Models) manages
# Ollama model pulls and enables/disables optional providers at runtime.
#
# Cloud models reference an `api_key_env` for naming purposes.
# Resolution under AUTH_ENABLED=true reads from the per-user
# `user_connector_credentials` table (connector ids `llm_anthropic`,
# `llm_openai`, `llm_xai`, `llm_perplexity`, `llm_gemini`, `llm_mistral`).
# The matching environment variable / `app_settings` row is honoured only
# under AUTH_ENABLED=false (single-user / legacy mode). See
# `services/llm_connector_map.py` for the env→connector mapping and
# `docs/connect-and-verify.md` for the per-user setup walkthrough.

models:
  claude:
    adapter: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    tools: true
    # proxy_url: http://litellm:4000  # uncomment to route through LiteLLM

  # Default local chat model — pulled on first start (OLLAMA_EXTRA_MODELS in .env).
  llama:
    adapter: openai
    model: llama3.2:3b
    base_url: http://ollama:11434/v1
    tools: false
    context_budget: 8192

  # --- Local models via Ollama ---
  # NOTE: You do NOT need to uncomment these manually.
  # Any model pulled via the dashboard (Settings → Models) or via
  #   docker exec lumogis-ollama-1 ollama pull llama3.2:3b
  # is automatically discovered by _dynamic_ollama_models() in config.py
  # and immediately appears in /v1/models and LibreChat after the next
  # librechat.yaml regeneration (triggered on orchestrator restart).
  # Default bootstrap shape: config/librechat.coldstart.yaml (librechat.yaml is gitignored).
  # These commented entries are reference examples only — define them
  # explicitly if you need non-default settings (tools, context_budget).
  #
  # llama:
  #   adapter: openai
  #   model: llama3.2:3b
  #   base_url: http://ollama:11434/v1
  #   tools: false
  #
  # qwen:
  #   adapter: openai
  #   model: qwen2.5:7b
  #   base_url: http://ollama:11434/v1
  #   tools: true
  #
  # qwen-coder:
  #   adapter: openai
  #   model: qwen2.5-coder:7b
  #   base_url: http://ollama:11434/v1
  #   tools: false

  # --- Optional cloud providers ---
  # Enable in Settings → Optional cloud providers, then add the API key.

  chatgpt:
    adapter: openai
    model: gpt-4o
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    tools: true
    optional: true

  grok:
    adapter: openai
    model: grok-2-latest
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    tools: false
    optional: true

  perplexity:
    adapter: openai
    model: sonar-pro
    base_url: https://api.perplexity.ai
    api_key_env: PERPLEXITY_API_KEY
    tools: false
    optional: true

  gemini:
    adapter: openai
    model: gemini-2.0-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    tools: false
    optional: true

  mistral:
    adapter: openai
    model: mistral-large-latest
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    tools: false
    optional: true

# --- Background model tasks (LUM-877) -----------------------------------------
# Each background job is a named task with its own model. List models, in order,
# under `tasks:` below (uncomment it). The first usable entry wins; if none is
# usable the task's code default (the comment on each line) is the last resort.
# An absent or empty `tasks:` block keeps today's behaviour exactly. Read at
# start-up and when a job starts: restart Core after editing. See
# orchestrator/services/task_models.py.
#
#   * On-box only (cannot be loosened): for the three email tasks, entity_extraction
#     (email attachments reach it) and routine_weekly_review (it reads email
#     signals), list on-box models only (loopback, a LAN address, or a host in
#     EMAIL_LLM_ALLOWLIST); any other entry is skipped. The email tasks also refuse
#     an off-box code default.
#   * temporal_judge uses only its first entry and never falls back down the list
#     (its verdicts can invalidate facts).
#   * The list is read when a job starts, from configuration. It is not runtime
#     failover: a listed model that is down fails the job; it does not move to the
#     next entry.
#   * List model aliases (qwen2.5), not Ollama tags (qwen2.5:7b). A model pulled
#     into Ollama has no context_budget, so prompts are sized to 2048 tokens; define
#     it under models: with a context_budget for larger prompts.
#   * Under privacy mode `local_only`, a listed cloud model is skipped, and the
#     privacy fallback may choose a different local model.
#
# tasks:
#   signal_enrichment: [llama]          # code default: llama
#   email_classify: [llama]             # code default: llama
#   email_reply_draft: [llama]          # code default: llama
#   email_compose_refine: [llama]       # code default: llama
#   entity_extraction: [llama]          # code default: llama
#   relation_extraction: [llama]        # code default: llama
#   session_summary: [qwen, llama]      # code default: llama
#   routine_weekly_review: [llama]      # code default: llama
#   temporal_extract: [llama]           # code default: llama
#   temporal_judge: [llama]             # code default: llama (the ADR 151 reference, LUM-927)
