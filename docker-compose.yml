services:
  orchestrator:
    # LUM-980: the published name of this image, and always build it here, so a
    # checkout never runs a released image by accident. The tag is per Compose
    # project (dev-lumogis, dev-lumogis-test, …), so a test stack's build never
    # replaces the image a running stack recreates from. The release compose file
    # (scripts/release/build_release_compose.py) drops build: and pulls instead.
    image: ghcr.io/lumogis/lumogis-orchestrator:${LUMOGIS_VERSION:-dev-${COMPOSE_PROJECT_NAME}}
    pull_policy: build
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
    # Host side is overridable so a second stack can run beside a first one.
    # Default is unchanged (8000) for every ordinary install. The CI
    # `doctor-integration` job sets this: it brings a full stack up on a
    # self-hosted runner that is also somebody's daily driver, and a hardcoded
    # 8000 made it fail with "port is already allocated" whenever a dev stack
    # was up — taking the whole job down before doctor ran at all.
    # `scripts/doctor/checks/services.sh` reads the published port back out of
    # `docker compose config`, and separately honours ORCHESTRATOR_HOST_PORT,
    # so the /healthz probe follows this automatically.
    # Loopback only (LUM-887 / INFRA-001): reach Core through Caddy (/api, /mcp,
    # /v1, /events), never by forwarding 8000. Same shape as Qdrant (LUM-565).
    # On Docker < 28, hosts on the same L2 segment can still reach a
    # 127.0.0.1-published port; that residual is the same as Qdrant's.
    - "127.0.0.1:${ORCHESTRATOR_HOST_PORT:-8000}:8000"
    # Every capability is dropped except what the root init in
    # docker-entrypoint.sh uses before it drops to the checkout owner (LUM-916):
    # CHOWN for the ownership repair, DAC_OVERRIDE to write the checkout
    # owner's .env and config/, FOWNER so `sed -i` on .env keeps its mode, and
    # SETUID / SETGID for `setpriv`. The app itself runs with none: the drop to
    # a non-root uid clears them.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    env_file: .env
    environment:
      FILESYSTEM_ROOT: /data
      FILESYSTEM_ROOT_HOST: ${FILESYSTEM_ROOT:-./lumogis-data}
      STACK_CONTROL_URL: http://stack-control:9000
      # Same-origin Lumogis Web (Caddy) + refresh-cookie CSRF: pin the browser
      # origin. Default matches http://localhost (port 80) — set in .env if you
      # use 127.0.0.1, HTTPS, or a LAN hostname. See .env.example.
      LUMOGIS_PUBLIC_ORIGIN: ${LUMOGIS_PUBLIC_ORIGIN:-http://localhost}
      # Core trusts only the Caddy container, by service name (resolved by
      # Docker DNS), for X-Forwarded-For. Caddy decides the client IP; see
      # LUMOGIS_CADDY_TRUSTED_PROXIES below. The app trusts no forwarded
      # headers unless this env is set (LUM-887 / ID-007).
      LUMOGIS_TRUSTED_PROXIES: ${LUMOGIS_TRUSTED_PROXIES:-caddy}
    volumes:
      - ${FILESYSTEM_ROOT:-./lumogis-data}:/data:ro
      # Project root — admin.py writes /project/.env (RERANKER_BACKEND, FILESYSTEM_ROOT),
      # librechat_config.py overwrites /project/config/librechat.yaml at runtime (gitignored).
      # librechat.coldstart.yaml is the tracked template; entrypoint seeds librechat.yaml if missing.
      # generates secrets in /project/.env on first boot.
      # Directory mount avoids Docker's single-file bind mount bug where individual
      # file mounts (./.env:/app/host.env) create empty directories instead of files.
      # The orchestrator process runs as the owner of this checkout folder
      # (LUMOGIS_RUN_UID / LUMOGIS_RUN_GID override it; 0 keeps root). LUM-887.
      - .:/project
      # ai-workspace/inbox → /workspace/inbox (auto-ingest); see .env.example (LUMOGIS_INBOX_*).
      # Everything Lumogis stores lives here: uploads, inbox, captures (LUM-892).
      - ${WORKSPACE_HOST_DIR:-./ai-workspace}:/workspace
      # DR backup mount — relocation via BACKUP_HOST_DIR on host (LUM-185).
      - ${BACKUP_HOST_DIR:-./ai-workspace/backups}:/workspace/backups
      # HuggingFace model cache — persists BGE reranker weights across container rebuilds
      - hf_cache:/var/lib/lumogis/hf-cache
      # LUM-695 outbound email attachment staging — WRITABLE, and deliberately
      # OUTSIDE /data. /data is mounted :ro above (so staging could never write
      # there) and FILESYSTEM_ROOT=/data makes it the folder-watcher's root, so a
      # staged file placed there would also be ingested as a new document.
      - email_staging:/var/lib/lumogis/email-staging
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      stack-control:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  qdrant:
    # Stock upstream image (LUM-980). The old local build only added curl for the
    # health check; bash's /dev/tcp does the same with nothing installed.
    image: qdrant/qdrant:v1.14.1
    # Loopback-only host publish — Qdrant HTTP API has no auth (ADR-053 FalkorDB precedent).
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6334}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # Qdrant mmap-opens many segment files at startup; Docker's default nofile=1024
    # triggers EMFILE ("Too many open files") on non-trivial volumes (seen on lumogis-test).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s
    restart: unless-stopped

  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumogis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumogis-dev}
      POSTGRES_DB: ${POSTGRES_DB:-lumogis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Development and test stacks: Postgres runs init.sql on a new volume. The
      # release compose drops this mount; the orchestrator then applies the same
      # file from its image to an empty database (LUM-980).
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumogis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Activepieces (optional automation UI) — see docker-compose.activepieces.yml
  # FalkorDB graph store (for graph plugins) — see docker-compose.falkordb.yml

  # mongodb + librechat are gated behind the `librechat` compose profile. The
  # .env.example leaves COMPOSE_PROFILES empty, so a new install skips them and
  # uses Lumogis Web (LUM-95). An existing install keeps its own .env; to start
  # LibreChat, set COMPOSE_PROFILES=librechat.
  mongodb:
    image: mongo:7.0
    profiles: ["librechat"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.7.9
    profiles: ["librechat"]
    ports:
      # Host only (LUM-916), like Core's 8000. LibreChat is not behind Caddy;
      # other devices use Lumogis Web through Caddy.
      - "127.0.0.1:3080:3080"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      APP_TITLE: ${APP_TITLE:-Lumogis}
      CUSTOM_FOOTER: ${CUSTOM_FOOTER:-[Dashboard & Settings](http://localhost:8000/dashboard)}
      # LibreChat hides email sign-up unless this is true (see routes/config registrationEnabled).
      # Default `false` per family-LAN plan D6 + D15 — open LAN registration
      # is the P0 audit finding A8 (docs/private/archive/MULTI-USER-AUDIT.md). The
      # supported multi-user path is Core-owned auth via /web/ + /api/v1/auth/*
      # (plan §24), not LibreChat self-signup.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    volumes:
      - ./config/librechat.yaml:/app/librechat.yaml:ro
      - ./branding/favicon-16x16.png:/app/client/public/assets/favicon-16x16.png:ro
      - ./branding/favicon-32x32.png:/app/client/public/assets/favicon-32x32.png:ro
      - ./branding/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png:ro
      - ./branding/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png:ro
      - ./branding/logo.svg:/app/client/public/assets/logo.svg:ro
      - ./branding/logo.svg:/app/client/dist/assets/logo.svg:ro
    depends_on:
      orchestrator:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    # Probe 127.0.0.1 — busybox wget resolves `localhost` to ::1 first while Node
    # often listens only on IPv4 (spurious "connection refused"). Image has wget,
    # not curl, so keep this as an exec-form probe.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3080"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  stack-control:
    image: ghcr.io/lumogis/lumogis-stack-control:${LUMOGIS_VERSION:-dev-${COMPOSE_PROJECT_NAME}}
    pull_policy: build
    build:
      context: ./stack-control
    env_file: .env
    environment:
      RESTART_SECRET: ${RESTART_SECRET:-}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No host ports — only reachable from within the Docker network

  # Lumogis Web SPA (nginx static) + Caddy reverse proxy — Phase 1 Pass 1.5.
  # http://localhost/ → SPA; /api/* /events /v1/* /mcp/* /health → orchestrator.
  lumogis-web:
    image: ghcr.io/lumogis/lumogis-web:${LUMOGIS_VERSION:-dev-${COMPOSE_PROJECT_NAME}}
    pull_policy: build
    build:
      context: ./clients/lumogis-web
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    expose:
      - "80"
    # Probe 127.0.0.1 — busybox wget resolves `localhost` to ::1 first while
    # nginx often listens only on IPv4 (spurious "connection refused").
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: ghcr.io/lumogis/lumogis-caddy:${LUMOGIS_VERSION:-dev-${COMPOSE_PROJECT_NAME}}
    pull_policy: build
    # Stock Caddy plus the Caddyfile and preflight (docker/caddy/Dockerfile). The
    # two file mounts below override the baked copies in a checkout.
    build:
      context: ./docker/caddy
    restart: unless-stopped
    # The preflight warns in this container's log when sign-in is off and
    # CADDY_DOMAIN is a public hostname, then runs Caddy (LUM-916).
    entrypoint: ["/bin/sh", "/etc/caddy/preflight.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
    # Host side overridable, same reason and same shape as the orchestrator's
    # port above — and this is the service that actually kept `doctor-integration`
    # red. Caddy starts LAST (it depends on orchestrator being healthy), so a
    # collision here wastes the entire stack bring-up before failing, and the
    # teardown removes every container: the job's own diagnostics then print an
    # empty `docker compose ps -a`, which reads like "nothing ever started".
    # Defaults are unchanged (80/443) for every ordinary install; only CI
    # overrides them. LAN access only by default — see
    # docs/deployment/remote-access.md for off-LAN/mobile setup.
      - "${CADDY_HTTP_HOST_PORT:-80}:80"
      - "${CADDY_HTTPS_HOST_PORT:-443}:443"
      - "${CADDY_HTTPS_HOST_PORT:-443}:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-:80}
      # Read only by the preflight above.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      # Upstream proxies Caddy believes for the client IP (space-separated
      # CIDRs). Default trusts none. See .env.example (LUM-887 / ID-007).
      LUMOGIS_CADDY_TRUSTED_PROXIES: ${LUMOGIS_CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      # Development only: the release compose drops these, the image has them.
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/preflight.sh:/etc/caddy/preflight.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      orchestrator:
        condition: service_healthy
      lumogis-web:
        condition: service_healthy

  # Pin a recent release: Docker Hub :latest can lag; Gemma 4+ needs Ollama ≥ ~0.20.
  ollama:
    image: ollama/ollama:0.20.3
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # GPU support added via docker-compose.gpu.yml (set COMPOSE_FILE in .env)

  # LiteLLM is optional — see docker-compose.litellm.yml
  # Enable for rate limiting, spend tracking, and observability.

  # ntfy: self-hosted push notification server for signal alerts and digest.
  # To enable:
  #   1. Uncomment the service below.
  #   2. Set NOTIFIER_BACKEND=ntfy in .env
  #   3. Set NTFY_URL=http://ntfy:80 and NTFY_TOPIC=lumogis in .env
  #   4. docker compose up -d ntfy
  #
  # ntfy:
  #   image: binwiederhier/ntfy:latest
  #   command: serve
  #   ports:
  #     - "8088:80"
  #   volumes:
  #     - ntfy_data:/var/cache/ntfy
  #   environment:
  #     NTFY_BASE_URL: http://localhost:8088
  #     NTFY_CACHE_FILE: /var/cache/ntfy/cache.db

  backup:
    init: true
    image: ghcr.io/lumogis/lumogis-backup:${LUMOGIS_VERSION:-dev-${COMPOSE_PROJECT_NAME}}
    pull_policy: build
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
      args:
        # Bump together with FALKORDB_IMAGE in docker-compose.falkordb.yml (.env.example).
        FALKORDB_IMAGE: ${FALKORDB_IMAGE:-falkordb/falkordb:v4.18.1}
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_SCHEDULE_CRON: ${BACKUP_SCHEDULE_CRON:-0 3 * * *}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_MAX_FAILED_SNAPSHOTS: ${BACKUP_MAX_FAILED_SNAPSHOTS:-3}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-24}
      BACKUP_INCLUDE_FALKORDB: ${BACKUP_INCLUDE_FALKORDB:-}
      WORKSPACE_PATH: /workspace
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      GRAPH_MODE: ${GRAPH_MODE:-disabled}
      FALKORDB_URL: ${FALKORDB_URL:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_HOST_DIR:-./ai-workspace/backups}:/backups
      # files store; restore writes here (LUM-892)
      - ${WORKSPACE_HOST_DIR:-./ai-workspace}:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mongodb_data:
  ollama_data:
  qdrant_data:
  postgres_data:
  hf_cache:      # HuggingFace model cache — persists across container rebuilds (BGE reranker)
  email_staging: # LUM-695 outbound attachment staging (writable; outside /data)
  # ntfy_data:   # uncomment if ntfy service above is enabled
