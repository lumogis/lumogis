# LUM-319 — doctor CI overlay: pin orchestrator env without docker-compose.test.yml
# `include:` chain (GHA Compose: "services.orchestrator conflicts with imported resource").
#
# Merge: docker compose -f docker-compose.yml -f docker-compose.test-doctor.yml
# See docker-compose.web-e2e-ci.yml (LUM-60) for the same base + overlay pattern.
services:
  orchestrator:
    env_file:
      - config/test.env.example
    environment:
      # Fast, public-export-safe doctor stack (no premium graph plugin / sidecars).
      GRAPH_MODE: disabled
      RERANKER_BACKEND: none
      LUMOGIS_INBOX_MODE: off
      INGEST_PATHS_WATCH_MODE: off
      LUMOGIS_DEFER_LIBRARY_INDEX: "1"
      CAPABILITY_SERVICE_URLS: ""
      # Skip entrypoint Ollama wait + model pulls — doctor JSON proof does not need embeddings.
      OLLAMA_SKIP_WAIT: "true"
      OLLAMA_EXTRA_MODELS: ""
