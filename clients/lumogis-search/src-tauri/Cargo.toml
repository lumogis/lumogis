[package]
name = "lumogis-search"
version = "0.1.0"
description = "Lumogis memory search desktop overlay (AGPL household client)"
authors = ["Lumogis"]
edition = "2021"
rust-version = "1.74"
license = "AGPL-3.0-only"
default-run = "lumogis-search"

[lib]
name = "lumogis_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumogis-search"
path = "src/main.rs"
required-features = ["standalone-app"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[features]
default = ["standalone-app"]
# LUM-455: single-instance is gated here so it is compiled/registered ONLY for the
# standalone Search binary. The Hub path-deps this crate with default-features=false,
# so the plugin is entirely absent from the Hub build/ACL tree.
standalone-app = ["dep:tauri-plugin-single-instance"]
wdio-e2e = [
  "dep:tauri-plugin-wdio",
  "dep:tauri-plugin-wdio-webdriver",
  "tauri/custom-protocol",
]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", optional = true }  # LUM-455 — Search only (gated by standalone-app)
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "blocking"] }
keyring = "3"
sha2 = "0.10"
tracing = "0.1"
url = "2"
urlencoding = "2"
global-hotkey = "0.6"
getrandom = "0.2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
