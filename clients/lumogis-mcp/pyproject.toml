[project]
name = "lumogis-mcp"
version = "0.1.0"
description = "Lumogis MCP stdio bridge for Cursor — forwards to Core Streamable HTTP at /mcp/"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = ["mcp>=1.27.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8", "uvicorn>=0.32"]

[project.scripts]
lumogis-mcp = "lumogis_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lumogis_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
