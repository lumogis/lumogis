#
# LUM-276 — preventive guard: actionlint + yq structural checks on publish-image.yml.
#
# SECURITY: Never use pull_request_target in this workflow — it would run untrusted
# PR head code with elevated token exposure. Fork PRs must stay on pull_request.
#
# Third-party Actions: immutable SHA pins only (ADR 037).

name: Attestation guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install yq (release binary + sha256)
        env:
          YQ_VERSION: v4.45.4
          YQ_SHA256: b96de04645707e14a12f52c37e6266832e03c29e95b9b139cddcae7314466e69
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m755 /tmp/yq /usr/local/bin/yq

      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Structural attestation invariants (publish-image.yml)
        run: |
          set -euo pipefail
          PUBLISH=.github/workflows/publish-image.yml

          if [[ ! -f .github/workflows/attestation-guard.yml ]] || [[ ! -f .github/workflows/attestation-verify.yml ]]; then
            echo "::error::Both attestation-guard.yml and attestation-verify.yml must exist in this checkout"
            exit 1
          fi

          WF_NAME="$(yq e '.name // ""' "$PUBLISH" | tr -d '\r')"
          if [[ "$WF_NAME" != "Publish image" ]]; then
            echo "::error::publish-image.yml workflow name must remain 'Publish image' (got '${WF_NAME:-empty}') for attestation-verify workflow_run wiring — LUM-276"
            exit 1
          fi

          check_job() {
            local job="$1"
            if [[ "$(yq e ".jobs[\"$job\"] == null" "$PUBLISH")" == "true" ]]; then
              echo "::error::Expected job '$job' in $PUBLISH"
              exit 1
            fi

            if [[ "$(yq e ".jobs[\"$job\"] | has(\"uses\")" "$PUBLISH")" == "true" ]]; then
              echo "::error::Job '$job' uses a reusable workflow (job-level 'uses:') — parser v1 cannot follow indirection (LUM-276). Inline attest steps in publish-image.yml."
              exit 1
            fi

            local jobif
            jobif="$(yq e ".jobs[\"$job\"].if // \"\"" "$PUBLISH" | tr -d '\r\n')"
            local compact="${jobif//[[:space:]]/}"
            if [[ "$compact" == "false" ]] || [[ "$compact" == '${{false}}' ]] || [[ "$compact" == '${{ false }}' ]]; then
              echo "::error::Job '$job' must not use a false-static guard on job.if (bypass risk)"
              exit 1
            fi

            if [[ "$(yq e ".jobs[\"$job\"].outputs.image_digest == null" "$PUBLISH")" == "true" ]]; then
              echo "::error::Job '$job' missing outputs.image_digest"
              exit 1
            fi

            local n
            n="$(yq e ".jobs[\"$job\"].steps | length" "$PUBLISH")"
            local found=0
            local found_idx=-1
            local i
            for ((i=0; i<n; i++)); do
              local uses
              uses="$(yq e ".jobs[\"$job\"].steps[$i].uses // \"\"" "$PUBLISH" | tr -d '\r')"
              if [[ "$uses" =~ ^actions/attest-build-provenance@[0-9a-f]{40}$ ]]; then
                found=$((found + 1))
                found_idx=$i
              fi
            done
            if [[ "$found" -ne 1 ]]; then
              echo "::error::Job '$job' must contain exactly one step with uses: actions/attest-build-provenance@<40-hex-sha> (found $found)"
              exit 1
            fi
            local stif
            stif="$(yq e ".jobs[\"$job\"].steps[$found_idx].if // \"\"" "$PUBLISH" | tr -d '\r\n')"
            if [[ -n "$stif" ]]; then
              echo "::error::Attest step in job '$job' index $found_idx must not have 'if:' (bypass risk). Remove conditional on attest-build-provenance (LUM-276)."
              exit 1
            fi
            local j
            for ((j=0; j<found_idx; j++)); do
              local run
              run="$(yq e ".jobs[\"$job\"].steps[$j].run // \"\"" "$PUBLISH" | head -c 200)"
              if [[ "$run" == "exit 1" ]] || [[ "$run" =~ ^exit[[:space:]]+1([[:space:]]|$) ]]; then
                echo "::error::Job '$job' has unconditional exit 1 before attest step (index $j) — bypass risk"
                exit 1
              fi
            done
          }

          check_job publish-orchestrator
          check_job publish-lumogis-web
