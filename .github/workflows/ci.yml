name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [main, master]

# Cancel superseded PR runs (saves Actions minutes — CI is the heaviest always-on
# workflow); never cancel an in-flight main run so the gate stays authoritative.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # LUM-379 — full history so diff-cover can diff against the PR base.
          fetch-depth: 0

      - name: LUM-190 — security-audit path gate contract tests
        run: bash .github/scripts/test-security-audit-paths.sh

      - name: LUM-486 — backup integration path gate contract tests
        run: bash .github/scripts/test-backup-integration-paths.sh

      - name: LUM-485 — backup retention prune unit test
        run: make test-backup-retention

      - name: LUM-60 — web-e2e path script syntax
        run: bash -n .github/scripts/web-e2e-paths.sh

      - name: Shellcheck CI path scripts (lint-and-test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/web-e2e-paths.sh
          shellcheck .github/scripts/test-security-audit-paths.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r orchestrator/requirements.txt
          pip install -r orchestrator/requirements-dev.txt
          pip install -r stack-control/requirements-dev.txt
          # lumogis-graph is omitted from the public AGPL export (see scripts/public-export-strip-list.txt).
          if [[ -f services/lumogis-graph/requirements.txt ]]; then
            pip install -r services/lumogis-graph/requirements.txt
            pip install -r services/lumogis-graph/requirements-dev.txt
          fi

      - name: Lint
        run: |
          ruff check orchestrator/
          ruff format --check orchestrator/

      - name: Test orchestrator
        run: |
          cd orchestrator && python -m pytest tests/ -x -q \
            --cov=. --cov-report=lcov:"$GITHUB_WORKSPACE/coverage-orchestrator.lcov"

      - name: Detect lumogis-mcp changes (PR)
        id: lumogis_mcp_changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(clients/lumogis-mcp/|scripts/install-cursor-mcp\.sh|Makefile|tests/fixtures/coding_bank\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test lumogis-mcp client (LUM-292)
        if: |
          github.event_name != 'pull_request' ||
          steps.lumogis_mcp_changes.outputs.run == 'true'
        run: make test-lumogis-mcp

      - name: Test stack-control
        run: |
          cd stack-control && python -m pytest test_main.py -q \
            --cov=. --cov-report=lcov:"$GITHUB_WORKSPACE/coverage-stack-control.lcov"

      - name: Test lumogis-graph
        run: |
          if [[ ! -f services/lumogis-graph/requirements.txt ]]; then
            echo "lumogis-graph not in checkout (public export); skipping"
            exit 0
          fi
          cd services/lumogis-graph && python -m pytest -q

      # LUM-379 — report changed-line coverage via diff-cover (advisory; no --fail-under).
      # PR-only (needs a base to diff against). lcov SF paths are emitted relative to each
      # test CWD, so prefix them to repo-relative before diff-cover matches the git diff.
      # Exemptions (migrations / generated / vendored) are documented in CONTRIBUTING.md.
      # Required --fail-under=80 gate deferred until LUM-384 matrix + burn-in (Linear child).
      - name: LUM-379 — changed-line coverage report (diff-cover, advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test -f coverage-orchestrator.lcov || { echo "missing coverage-orchestrator.lcov" >&2; exit 1; }
          test -f coverage-stack-control.lcov || { echo "missing coverage-stack-control.lcov" >&2; exit 1; }
          sed -i 's#^SF:#SF:orchestrator/#' coverage-orchestrator.lcov
          sed -i 's#^SF:#SF:stack-control/#' coverage-stack-control.lcov
          # Advisory only — omit --fail-under until required gate is promoted (see CONTRIBUTING.md).
          diff-cover coverage-orchestrator.lcov coverage-stack-control.lcov \
            --compare-branch "$BASE_SHA" \
            --show-uncovered \
            --exclude '*/migrations/*' \
            --exclude '*/alembic/*' \
            --exclude '*/generated/*' \
            --exclude '*/vendor/*'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: LUM-429 — coverage matrix format + feature-ids.json
        run: make coverage-matrix-check

  compose-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (LUM-43 compose policy script)
        run: pip install -r scripts/requirements-compose-policy.txt

      - name: Install orchestrator deps (egress ACL check imports capability models)
        run: pip install -r orchestrator/requirements.txt

      - name: Bootstrap .env for docker compose config
        run: cp .env.example .env

      - name: LUM-43 compose policy (baseline, mock overlay, adversarial)
        env:
          MOCK_CAPABILITY_SHARED_SECRET: lumogis-ci-mock-capability-placeholder
        run: |
          make compose-policy-check-baseline
          make compose-policy-check
          make compose-policy-check-adversarial
          make compose-policy-check-adversarial-envfile
          make compose-policy-check-community
          make compose-policy-check-egress
          make check-egress-acl-divergence
          make check-no-tethered-lum613

  # LUM-618 — live container-network egress containment proof (Docker + Squid).
  egress-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: egress-containment-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r orchestrator/requirements.txt -r orchestrator/requirements-dev.txt

      - name: Free runner disk before compose build
        run: |
          docker system prune -af --volumes || true
          df -h /

      - name: Egress containment (allowed spliced / denied refused / no-route)
        run: make egress-containment-test

  web-docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # BuildKit GHA cache export (LUM-445)
    timeout-minutes: 20
    concurrency:
      group: web-docker-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate path-detection script syntax
        run: bash -n .github/scripts/web-docker-build-paths.sh

      - name: Shellcheck path-detection script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/web-docker-build-paths.sh

      - name: Determine if web Docker build is needed
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: bash -euo pipefail .github/scripts/web-docker-build-paths.sh

      - name: Bootstrap .env for compose
        if: steps.paths.outputs.should_build == 'true'
        run: |
          test -f .env.example || (echo "web-docker-build: missing .env.example" >&2; exit 1)
          cp .env.example .env

      - name: Set up Docker Buildx
        if: steps.paths.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker compose build lumogis-web
        if: steps.paths.outputs.should_build == 'true'
        uses: docker/bake-action@v6
        with:
          files: docker-compose.yml
          targets: lumogis-web
          pull: true
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Skip web Docker build (path contract)
        if: steps.paths.outputs.should_build != 'true'
        run: |
          echo 'SKIP_WEB_DOCKER_BUILD: no paths matched contract'

  openapi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: openapi-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OpenAPI check script syntax
        run: |
          bash -n .github/scripts/openapi-check-paths.sh
          bash -n .github/scripts/openapi-breaking-check.sh

      - name: Shellcheck OpenAPI path script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/openapi-check-paths.sh

      - name: Determine if OpenAPI codegen check is needed
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: bash -euo pipefail .github/scripts/openapi-check-paths.sh

      - uses: actions/setup-python@v5
        if: steps.paths.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.should_run == 'true'
        with:
          node-version: "20"

      - name: Install web deps and run OpenAPI check
        if: steps.paths.outputs.should_run == 'true'
        run: |
          cd clients/lumogis-web && npm ci
          cd "$GITHUB_WORKSPACE" && make openapi-check

      - uses: actions/setup-go@v5
        if: steps.paths.outputs.should_run == 'true'
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install oasdiff (OpenAPI breaking gate, LUM-302)
        if: steps.paths.outputs.should_run == 'true'
        run: |
          go install github.com/oasdiff/oasdiff@v1.15.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          oasdiff --version

      - name: OpenAPI breaking-check fixtures + gate
        if: steps.paths.outputs.should_run == 'true'
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          # LUM-312 — post burn-in: tightened from ERR to WARN so potential-breaking
          # (WARN-level) findings also fail CI, not just definite breaking changes.
          OPENAPI_BREAKING_FAIL_ON: WARN
        run: |
          set -euo pipefail
          FIXDIR="scripts/fixtures/openapi-breaking-check"
          oasdiff breaking "$FIXDIR/base.json" "$FIXDIR/after-compatible.json" --format githubactions --fail-on ERR
          set +e
          oasdiff breaking "$FIXDIR/base.json" "$FIXDIR/after-breaking.json" --format githubactions --fail-on ERR
          brc=$?
          set -e
          if [[ "$brc" -ne 1 ]]; then
            echo "openapi-breaking fixture: expected oasdiff exit 1 on breaking pair, got ${brc}" >&2
            exit 1
          fi
          set +e
          out=$(OPENAPI_BREAKING_FAIL_ON=off bash .github/scripts/openapi-breaking-check.sh 2>&1)
          off_rc=$?
          set -e
          if [[ "$off_rc" -ne 0 ]]; then
            echo "openapi-breaking-check: OPENAPI_BREAKING_FAIL_ON=off expected exit 0, got ${off_rc}" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out" | grep -Fq "::warning::OpenAPI breaking gate bypassed (OPENAPI_BREAKING_FAIL_ON=off)" || {
            echo "openapi-breaking-check: missing audit line for OPENAPI_BREAKING_FAIL_ON=off" >&2
            echo "$out" >&2
            exit 1
          }
          make openapi-breaking-check

      # LUM-314 — optional human-readable HTML changelog of the OpenAPI drift.
      # oasdiff annotations are dense; this artefact helps reviewers eyeball large
      # snapshot diffs. Review UX only — never gates: continue-on-error + tolerant
      # of a missing base snapshot. Reuses the oasdiff already installed above
      # (its `changelog --format html`), so no extra tool dependency.
      - name: OpenAPI changes HTML report (review UX, LUM-314)
        if: steps.paths.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -uo pipefail
          SNAP="clients/lumogis-web/openapi.snapshot.json"
          # Resolve the same base revision the breaking gate uses (PR merge-base,
          # else previous commit) so the report matches the gate's comparison.
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" && -n "${BASE_SHA:-}" && -n "${HEAD_SHA:-}" ]]; then
            base_rev="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")"
          else
            base_rev="HEAD~1"
          fi
          mkdir -p openapi-report
          if ! git show "${base_rev}:${SNAP}" > openapi-report/base.json 2>/dev/null; then
            echo "LUM-314: no base snapshot at ${base_rev}:${SNAP}; skipping HTML report"
            exit 0
          fi
          if ! oasdiff changelog openapi-report/base.json "$SNAP" --format html \
                > openapi-report/openapi-changes.html 2>openapi-report/oasdiff.err; then
            echo "LUM-314: oasdiff changelog failed; skipping HTML report"
            cat openapi-report/oasdiff.err >&2 || true
            exit 0
          fi
          echo "LUM-314: wrote openapi-report/openapi-changes.html (base ${base_rev})"

      - name: Upload OpenAPI changes HTML report (LUM-314)
        if: steps.paths.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: openapi-changes-html
          path: openapi-report/openapi-changes.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Skip OpenAPI check (path contract)
        if: steps.paths.outputs.should_run != 'true'
        run: |
          echo 'SKIP_OPENAPI_CHECK: no paths matched contract'
          exit 0

  doctor-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: doctor-integration-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate doctor integration path script syntax
        run: bash -n .github/scripts/doctor-integration-paths.sh

      - name: Shellcheck doctor integration path script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/doctor-integration-paths.sh

      - name: Determine if doctor integration is needed
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: bash -euo pipefail .github/scripts/doctor-integration-paths.sh

      - name: Ensure jq is available
        if: steps.paths.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            jq --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq
          command -v jq >/dev/null 2>&1 || { echo "doctor-integration: jq missing after apt install" >&2; exit 1; }
          jq --version

      - name: Free runner disk before compose build
        if: steps.paths.outputs.should_run == 'true'
        run: |
          docker system prune -af --volumes || true
          docker builder prune -af || true
          df -h /

      - name: Run compose-test-doctor (live stack + doctor JSON)
        if: steps.paths.outputs.should_run == 'true'
        run: make compose-test-doctor

      - name: Upload doctor.json (debug)
        if: always() && steps.paths.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: doctor-json
          path: doctor.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Compose diagnostics (bounded)
        if: always() && steps.paths.outputs.should_run == 'true'
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: lumogis-test
          COMPOSE_FILE: docker-compose.yml:docker-compose.test-doctor.yml
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          docker compose --env-file config/test.env.example ps -a
          docker compose --env-file config/test.env.example logs --tail=200

      - name: Skip doctor integration (path contract)
        if: steps.paths.outputs.should_run != 'true'
        run: |
          echo 'SKIP_DOCTOR_INTEGRATION: no paths matched contract'
          exit 0

  backup-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: backup-integration-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate backup integration path script syntax
        run: bash -n .github/scripts/backup-integration-paths.sh

      - name: Shellcheck backup integration path script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/backup-integration-paths.sh
          shellcheck .github/scripts/test-backup-integration-paths.sh

      - name: Determine if backup integration is needed
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: bash -euo pipefail .github/scripts/backup-integration-paths.sh

      - name: Ensure jq is available
        if: steps.paths.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            jq --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq
          command -v jq >/dev/null 2>&1 || { echo "backup-integration: jq missing after apt install" >&2; exit 1; }
          jq --version

      - name: Run compose-test-backup (DR volume-wipe round-trip)
        if: steps.paths.outputs.should_run == 'true'
        env:
          BACKUP_INCLUDE_FALKORDB: "true"
          QDRANT_HOST_PORT: "6336"
          FALKORDB_HOST_PORT: "6381"
        run: make compose-test-backup

      - name: Compose diagnostics (bounded)
        if: always() && steps.paths.outputs.should_run == 'true'
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: lumogis-test-backup
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          if [[ -f docker-compose.falkordb.yml ]]; then
            export COMPOSE_FILE=docker-compose.yml:docker-compose.falkordb.yml
            services="backup falkordb postgres qdrant"
          else
            export COMPOSE_FILE=docker-compose.yml
            services="backup postgres qdrant"
          fi
          docker compose --env-file config/test.env.example ps -a
          # shellcheck disable=SC2086  # $services is an intentional space-separated service list
          docker compose --env-file config/test.env.example logs --tail=200 $services

      - name: Skip backup integration (path contract)
        if: steps.paths.outputs.should_run != 'true'
        run: |
          echo 'SKIP_BACKUP_INTEGRATION: no paths matched contract'
          exit 0

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: security-audit-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate path-detection script syntax
        run: bash -n .github/scripts/security-audit-paths.sh

      - name: Shellcheck security-audit path script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/security-audit-paths.sh

      - name: Determine if security audit is needed
        id: paths
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: bash -euo pipefail .github/scripts/security-audit-paths.sh

      - uses: actions/setup-python@v5
        if: steps.paths.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-security-audit.txt

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.should_run == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/lumogis-web/package-lock.json

      - name: Install tools and run dependency audit (blocking)
        if: steps.paths.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          pip install -r scripts/requirements-security-audit.txt
          cd clients/lumogis-web && npm ci
          cd "$GITHUB_WORKSPACE"
          make audit-local || (echo "retry: make audit-local" && sleep 5 && make audit-local)

      - name: Bandit orchestrator (advisory)
        if: steps.paths.outputs.should_run == 'true'
        run: |
          set +e
          bandit -r orchestrator/ -ll -ii 2>&1 | tee bandit-orchestrator.log
          ec=$?
          {
            echo "### Bandit (orchestrator)"
            echo "Exit code: ${ec}"
            echo ""
            echo '```'
            tail -c 100000 bandit-orchestrator.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Bandit lumogis-graph (advisory, private checkouts only)
        if: steps.paths.outputs.should_run == 'true'
        run: |
          if [[ ! -d services/lumogis-graph ]]; then
            echo "lumogis-graph not in checkout; skipping second Bandit pass"
            exit 0
          fi
          set +e
          bandit -r services/lumogis-graph/ -ll -ii 2>&1 | tee bandit-graph.log
          ec=$?
          {
            echo "### Bandit (services/lumogis-graph)"
            echo "Exit code: ${ec}"
            echo ""
            echo '```'
            tail -c 100000 bandit-graph.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload Bandit orchestrator log
        if: steps.paths.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bandit-orchestrator
          path: bandit-orchestrator.log
          retention-days: 7

      - name: Skip security audit (path contract)
        if: steps.paths.outputs.should_run != 'true'
        run: |
          echo 'SKIP_SECURITY_AUDIT: no paths matched contract'
          exit 0
