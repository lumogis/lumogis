# LUM-329 — build Lumogis desktop overlay (Tauri 2) on macOS, Windows, Linux.
# Pinned actions: prefer full SHAs in org hardening passes; tags here match current tauri-action v2 line.
name: desktop-build

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - "clients/lumogis-desktop/**"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact: macos-arm64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact: macos-x64
          - platform: ubuntu-22.04
            args: ""
            artifact: linux-x64
          - platform: windows-latest
            args: ""
            artifact: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/lumogis-desktop/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: add macOS cross targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: install webkit deps (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: npm ci + vite build
        working-directory: clients/lumogis-desktop
        run: npm ci && npm run build

      - name: Run Rust unit tests (cargo test)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: clients/lumogis-desktop/src-tauri
        run: cargo test

      # tauri-action@v0: --config is relative to projectPath (clients/lumogis-desktop).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/lumogis-desktop
          args: --config src-tauri/tauri.client-only.conf.json ${{ matrix.args }}

      - name: Upload desktop build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: lumogis-overlay-${{ matrix.artifact }}
          path: |
            clients/lumogis-desktop/src-tauri/target/release/bundle/
            clients/lumogis-desktop/src-tauri/target/*/release/bundle/
          if-no-files-found: error
