# Copyright (C) 2026 Lumogis
#
# publish-image.yml — builds from lumogis/lumogis (public verified
# source only). Images must not be published from lumogis/lumogis-app.
# See LUM-225 and ADR 037.
#
# This file is kept in lumogis-app so the public export carries it: the
# export is an rsync with --delete, which removed a public-only copy in
# 0.5.0. Every job is guarded on github.repository, so it never runs in
# lumogis-app (ADR 037, amended 2026-11-14).
#
# LUM-980 / LUM-989: six images, everything a household's docker compose pulls
# (lumogis-graph only once its Compose profile is switched on):
# orchestrator, lumogis-web, stack-control, backup, caddy and lumogis-graph. Tags:
#   * push to main          -> latest, main  (the build rehearsal before a release)
#   * push of tag vX.Y.Z     -> X.Y.Z         (also X.Y.Z-rc.N for prereleases)
#   * manual run on main     -> X.Y.Z when release_version is set
# `release` and `X.Y` are NOT set here: release-assets.yml moves them by digest
# once the release's docker-compose.yml / example.env have been verified.
# Each image carries LUMOGIS_IMAGE_VERSION; the orchestrator also carries the
# fingerprint of the release compose file (compose freshness check).
#
# Related: .github/workflows/attestation-verify.yml triggers on the workflow
# `name:` below — keep these in sync (LUM-276).
#
# All third-party Action refs are pinned to immutable commit SHAs.
# Human-readable version tags are shown as comments.

# DO NOT RENAME — referenced by .github/workflows/attestation-verify.yml (workflow_run.workflows: ["Publish image"])
name: Publish image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: "Also tag the images with this version, e.g. 0.12.0 (no leading v). Leave empty for latest only."
        required: false
        default: ""
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-orchestrator:
    name: publish-orchestrator
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'lumogis/lumogis'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.push_image.outputs.digest }}
      image_ref: ${{ steps.push_image.outputs.imageid }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2024-02-12
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Resolve the image version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if [[ -n "${RELEASE_VERSION:-}" && ! "$RELEASE_VERSION" =~ $re ]]; then
            echo "::error::release_version must look like 0.12.0 (got '${RELEASE_VERSION}')"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          elif [[ -n "${RELEASE_VERSION:-}" ]]; then
            version="$RELEASE_VERSION"
          else
            version="${SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The orchestrator carries the fingerprint of this commit's release
      # docker-compose.yml, so it can tell a user whose copy is out of date.
      - name: Fingerprint the release compose file
        id: compose_fp
        run: |
          set -euo pipefail
          # PyYAML ships on GitHub's Ubuntu runners; install it only if missing.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages 'PyYAML>=6,<7'
          echo "fingerprint=$(python3 scripts/release/build_release_compose.py --fingerprint-only)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lumogis/lumogis-orchestrator
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.release_version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push_image
        with:
          context: .
          file: orchestrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          build-args: |
            LUMOGIS_IMAGE_VERSION=${{ steps.version.outputs.version }}
            LUMOGIS_COMPOSE_FINGERPRINT=${{ steps.compose_fp.outputs.fingerprint }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest GHCR image (SLSA L2 build provenance)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/lumogis/lumogis-orchestrator
