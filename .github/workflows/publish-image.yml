          elif [[ -n "${RELEASE_VERSION:-}" ]]; then
            version="$RELEASE_VERSION"
          else
            version="${SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lumogis/lumogis-graph
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.release_version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push_image
        with:
          context: .
          file: services/lumogis-graph/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          build-args: |
            LUMOGIS_IMAGE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest GHCR image (SLSA L2 build provenance)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/lumogis/lumogis-graph
          subject-digest: ${{ steps.push_image.outputs.digest }}
          push-to-registry: true

  # Job outputs are not exposed on the Actions jobs REST API; attestation-verify.yml
  # downloads this artifact from the publish run (LUM-276). Each key carries its
  # image name, so the verifier needs no hand-written mapping (LUM-980).
  record-publish-digests:
    name: record-publish-digests
    needs:
      - publish-orchestrator
      - publish-lumogis-web
      - publish-stack-control
      - publish-backup
      - publish-caddy
      - publish-lumogis-graph
    if: >-
      github.repository == 'lumogis/lumogis'
      && needs.publish-orchestrator.result == 'success'
      && needs.publish-lumogis-web.result == 'success'
      && needs.publish-stack-control.result == 'success'
      && needs.publish-backup.result == 'success'
      && needs.publish-caddy.result == 'success'
      && needs.publish-lumogis-graph.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Write publish digests manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg orchestrator '${{ needs.publish-orchestrator.outputs.image_digest }}' \
            --arg lumogis_web '${{ needs.publish-lumogis-web.outputs.image_digest }}' \
            --arg stack_control '${{ needs.publish-stack-control.outputs.image_digest }}' \
            --arg backup '${{ needs.publish-backup.outputs.image_digest }}' \
            --arg caddy '${{ needs.publish-caddy.outputs.image_digest }}' \
            --arg lumogis_graph '${{ needs.publish-lumogis-graph.outputs.image_digest }}' \
            '{ "publish-orchestrator": { "image": "ghcr.io/lumogis/lumogis-orchestrator", "digest": $orchestrator }, "publish-lumogis-web": { "image": "ghcr.io/lumogis/lumogis-web", "digest": $lumogis_web }, "publish-stack-control": { "image": "ghcr.io/lumogis/lumogis-stack-control", "digest": $stack_control }, "publish-backup": { "image": "ghcr.io/lumogis/lumogis-backup", "digest": $backup }, "publish-caddy": { "image": "ghcr.io/lumogis/lumogis-caddy", "digest": $caddy }, "publish-lumogis-graph": { "image": "ghcr.io/lumogis/lumogis-graph", "digest": $lumogis_graph }, "expected": ["publish-orchestrator", "publish-lumogis-web", "publish-stack-control", "publish-backup", "publish-caddy", "publish-lumogis-graph"] }' > publish-digests.json
          test -s publish-digests.json
          cat publish-digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-digests
          path: publish-digests.json
          retention-days: 30
