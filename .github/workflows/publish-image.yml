#
# publish-image.yml — builds from lumogis/lumogis (public verified
# source only). Images must not be published from lumogis/lumogis-app.
# See LUM-225 and ADR 037.
#
# Related: .github/workflows/attestation-verify.yml triggers on the workflow
# `name:` below — keep these in sync (LUM-276).
#
# All third-party Action refs are pinned to immutable commit SHAs.
# Human-readable version tags are shown as comments.

# DO NOT RENAME — referenced by .github/workflows/attestation-verify.yml (workflow_run.workflows: ["Publish image"])
name: Publish image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-orchestrator:
    name: publish-orchestrator
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'lumogis/lumogis'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.push_image.outputs.digest }}
      image_ref: ${{ steps.push_image.outputs.imageid }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2024-02-12
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lumogis/lumogis-orchestrator
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push_image
        with:
          context: .
          file: orchestrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest GHCR image (SLSA L2 build provenance)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/lumogis/lumogis-orchestrator
          subject-digest: ${{ steps.push_image.outputs.digest }}
          push-to-registry: true

  publish-lumogis-web:
    name: publish-lumogis-web
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'lumogis/lumogis'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.push_image.outputs.digest }}
      image_ref: ${{ steps.push_image.outputs.imageid }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main 2024-02-12
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/lumogis/lumogis-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push_image
        with:
          context: ./clients/lumogis-web
          file: clients/lumogis-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest GHCR image (SLSA L2 build provenance)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/lumogis/lumogis-web
          subject-digest: ${{ steps.push_image.outputs.digest }}
          push-to-registry: true

  # Job outputs are not exposed on the Actions jobs REST API; attestation-verify.yml
  # downloads this artifact from the publish run (LUM-276).
  record-publish-digests:
    name: record-publish-digests
    needs:
      - publish-orchestrator
      - publish-lumogis-web
    if: >-
      github.repository == 'lumogis/lumogis'
      && needs.publish-orchestrator.result == 'success'
      && needs.publish-lumogis-web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Write publish digests manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg orch '${{ needs.publish-orchestrator.outputs.image_digest }}' \
            --arg web '${{ needs.publish-lumogis-web.outputs.image_digest }}' \
            '{ "publish-orchestrator": $orch, "publish-lumogis-web": $web }' > publish-digests.json
          test -s publish-digests.json
          cat publish-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: publish-digests
          path: publish-digests.json
          retention-days: 30
