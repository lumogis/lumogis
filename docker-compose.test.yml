# RC / integration overlay: includes the default stack but pins Core (`orchestrator`)
# env to `config/test.env.example` so a developer `AUTH_ENABLED=false` `.env` on the
# host does not leak into `lumogis-test` (verify-public-rc expects auth-on behaviour).
#
# Merge as: docker-compose.yml:docker-compose.test.yml[:docker-compose.public-rc-stack.yml]
include:
  - path: docker-compose.yml

services:
  orchestrator:
    env_file:
      - config/test.env.example
    # `config/test.env.example` sets POSTGRES_HOST=127.0.0.1:5433 for host-side
    # pytest (published port). Inside the compose network, services must use the
    # `postgres` service name — otherwise Core/lumogis-graph crash-loop on boot.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

  # Host-side integration gates (LUM-540 full cursor integration) probe Postgres
  # from pytest on the developer machine — publish beside default dev stack (5432).
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
