# RC / integration overlay: includes the default stack but pins Core (`orchestrator`)
# env to `config/test.env.example` so a developer `AUTH_ENABLED=false` `.env` on the
# host does not leak into `lumogis-test` (verify-public-rc expects auth-on behaviour).
#
# Merge as: docker-compose.yml:docker-compose.test.yml[:docker-compose.public-rc-stack.yml]
#
# LUM-249: env_file uses `!override` to REPLACE (not concatenate) the inherited
# `env_file: .env` from docker-compose.yml. Compose's default merge rule for
# list-typed fields like env_file appends, which causes the host `.env` to leak
# into the `lumogis-test` orchestrator alongside config/test.env.example.
include:
  - path: docker-compose.yml

services:
  orchestrator:
    env_file: !override
      - config/test.env.example
