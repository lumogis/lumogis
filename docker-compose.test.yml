# RC / integration overlay: includes the default stack but pins Core (`orchestrator`)
# env to `config/test.env.example` so a developer `AUTH_ENABLED=false` `.env` on the
# host does not leak into `lumogis-test` (verify-public-rc expects auth-on behaviour).
#
# Merge as: docker-compose.yml:docker-compose.test.yml[:docker-compose.public-rc-stack.yml]
include:
  - path: docker-compose.yml

services:
  orchestrator:
    env_file:
      - config/test.env.example
