# LUM-618 — egress proxy for untrusted community capabilities.
#
# Deny-all forward proxy. Each community capability container has a STATIC source
# IP on `community-egress-internal` (see docker-compose.egress.yml) and may reach
# ONLY the bare hosts in its own per-source allow file (its declared
# external_endpoints, generated by scripts/gen_capability_egress_acl.py).
#
# HTTPS is allowlisted by TLS SNI using peek+splice: Squid PEEKS the ClientHello
# to read the SNI, then SPLICES (passes through, end-to-end TLS, NO decryption /
# NO MITM / NO CA injection) only when the SNI matches; everything else is
# terminated. HTTP is allowlisted by dstdomain.
#
# NOTE (LUM-618 PoC / plan step 1): peek+splice for an EXPLICIT forward proxy
# requires a Squid image built --with-openssl and a tls-cert on the port even
# though we never bump/decrypt. The exact peek/splice/terminate ordering is
# validated in the PoC before the full wiring. Documented fallback if splice
# proves fragile on the deny path: `http_access deny CONNECT !<allow>` so a
# non-allowed CONNECT is refused outright.

# ── Listener ──────────────────────────────────────────────────────────────────
# ssl-bump enables the SslBump machinery (needed even for splice-only). bump.pem
# is generated per-deploy by gen-bump-cert.sh, mounted :ro, and NEVER used to
# sign anything (we splice) — it only initialises the TLS context.
http_port 3128 ssl-bump \
  tls-cert=/etc/squid/bump.pem \
  generate-host-certificates=off

# ── Per-source identity (static IPs from the compose overlay) ────────────────
acl cap_mock_src src 172.31.0.10

# ── Per-source allow files (the generated external_endpoints) ────────────────
# SNI match for HTTPS (peek+splice); dstdomain for cleartext HTTP.
# NOTE: no `dst` ACL here — it would load this hostname allow file as IP literals
# and force a startup DNS resolution of each name. IPv4-literal external_endpoints
# (which normalise_external_endpoints permits) are a deferred follow-up: they need
# a SEPARATE IP-only allow file fed to a `dst` ACL, not this hostname file.
acl cap_mock_sni  ssl::server_name "/etc/squid/allow/lumogis.mock.echo.txt"
acl cap_mock_dom  dstdomain        "/etc/squid/allow/lumogis.mock.echo.txt"

# ── SslBump: peek the SNI, splice allowed, terminate the rest ────────────────
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice cap_mock_sni
ssl_bump terminate all

# ── Access control (deny-all default) ────────────────────────────────────────
# HTTPS: allowed via the spliced SNI match, scoped to the capability's source IP.
http_access allow cap_mock_src cap_mock_sni
# HTTP: allowed by dstdomain, scoped to the source IP.
http_access allow cap_mock_src cap_mock_dom
# Everything else — fail closed.
http_access deny all

# ── Hardening ────────────────────────────────────────────────────────────────
cache deny all
# Do not leak proxy/host details to upstreams or clients.
via off
forwarded_for delete
httpd_suppress_version_string on
# Minimal, structured access log so operators / Core can see denials (LUM-621).
# Deliberately trimmed vs Squid built-in `squid` format: drop %<st and hierarchy.
logformat lumogis_egress %ts.%03tu %06tr %>a %Ss/%03>Hs %rm %ru %[un
access_log stdio:/var/log/squid/access.log lumogis_egress
cache_log stdio:/var/log/squid/cache.log
